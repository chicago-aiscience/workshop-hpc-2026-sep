# Workshop conda environment. A trimmed, pinned subset of the production
# core_env.yaml -- only what the learned-consensus discharge demo needs. Pinning
# is the Workshop 5 reproducibility lesson: the same spec rebuilds the same env.
#
#   conda env create -f environment.yml
#   conda activate workshop-hpc
#
# netcdf4 (+ the numpy/pandas stack) come from conda-forge so the HDF5 libraries
# they need are handled by conda; torch is installed via pip (its wheels bundle
# their own CUDA runtime, so only the node's NVIDIA driver is required).
name: workshop-hpc
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.2.*
  - pandas=2.3.*
  - matplotlib=3.10.*
  - scikit-learn=1.7.*
  - netcdf4=1.7.*
  - tqdm=4.67.*
  - pyyaml=6.*
  - pip:
      - torch==2.8.*
